apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-atlas
spec:
  replicas: 2
  selector:
    matchLabels:
      app: task-atlas
  template:
    metadata:
      labels:
        app: task-atlas
    spec:
      containers:
      - name: flask
        image: nainas08/flask-task-app:latest   # Your Docker Hub image
        ports:
        - containerPort: 5000
        env:
        - name: FLASK_ENV
          value: production